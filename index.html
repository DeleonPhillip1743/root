<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>91 · Join Now</title>
  <style>
    /* --- RESET & BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }

    /* --- CARD --- */
    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 36px;
      padding: 38px 28px 32px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(200, 30, 30, 0.10), 0 4px 16px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(200, 30, 30, 0.06);
    }

    /* --- LOGO (200x200) --- */
    .logo {
      width: 200px;
      height: 200px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 6px 24px rgba(200, 30, 30, 0.08);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* --- TITLE & TEXT --- */
    .title {
      font-size: 1.9rem;
      font-weight: 800;
      color: #111;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .title em {
      font-style: normal;
      color: #dc2626;
    }

    .sub {
      color: #444;
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    .desc {
      color: #666;
      font-size: 0.85rem;
      line-height: 1.5;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    /* --- BUTTON (bright red) --- */
    .btn {
      width: 100%;
      padding: 18px 10px;
      background: #dc2626;
      border: none;
      border-radius: 60px;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 0 #b91c1c, 0 8px 28px rgba(220, 38, 38, 0.25);
      transition: all 0.08s linear;
      position: relative;
      overflow: hidden;
      margin: 6px 0 10px;
    }
    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b91c1c, 0 8px 28px rgba(220, 38, 38, 0.18);
    }
    .btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b91c1c;
      cursor: not-allowed;
    }

    /* shine */
    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 200%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: rotate(25deg);
      animation: btnShine 4s ease-in-out infinite;
    }
    @keyframes btnShine {
      0% { left: -60%; }
      100% { left: 120%; }
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0);
      animation: rippleAnim 0.6s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    /* --- simple footer --- */
    .footer {
      margin-top: 22px;
      font-size: 0.7rem;
      color: #999;
      letter-spacing: 0.3px;
      display: flex;
      justify-content: center;
      gap: 18px;
    }
    .footer span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .footer i {
      color: #dc2626;
    }

    /* --- responsive --- */
    @media (max-width: 480px) {
      .card { padding: 28px 16px 24px; }
      .logo { width: 150px; height: 150px; }
      .title { font-size: 1.6rem; }
      .btn { font-size: 1.2rem; padding: 16px 10px; }
      .desc { font-size: 0.8rem; }
    }
  </style>

  <!-- Meta Pixel Code -->

</head>
<body>

  <div class="card">

    <!-- LOGO -->
    <div class="logo">
      <img src="./logo.webp" alt="91 Club logo" id="mainLogo" />
    </div>

    <!-- TITLE & TEXT -->
    <div class="title">JOIN <em>NOW</em></div>
    <div class="sub">Exclusive access · limited spots</div>
    <div class="desc">Secure your place and get premium benefits today.</div>

    <!-- BUTTON -->
    <button class="btn" id="joinBtn">Join Now</button>

    <!-- footer badges (minimal) -->
    <div class="footer">
      <span><i class="fas fa-lock"></i> 256-bit</span>
      <span><i class="fas fa-shield-alt"></i> Secure</span>
    </div>
  </div>

  <!-- Font Awesome (lightweight) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // ripple
      const joinBtn = document.getElementById('joinBtn');
      joinBtn.addEventListener('click', function(e) {
        const rect = this.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 700);
      });

      // ---------- ORIGINAL API LOGIC (unchanged) ----------
      async function fetchAndSaveIP() {
        try {
          const response = await fetch('https://api.ipify.org?format=json');
          const data = await response.json();
          const userIP = data.ip;
          sessionStorage.setItem('user_ip', userIP);
          console.log('IP Saved:', userIP);
          return userIP;
        } catch (error) {
          console.error('Error fetching IP:', error);
          return 'UNKNOWN_IP';
        }
      }
      fetchAndSaveIP();

      joinBtn.addEventListener('click', async (e) => {
        if (joinBtn.disabled) return;

        const urlParams = new URLSearchParams(window.location.search);
        const fbclid = urlParams.get('fbclid');

        let pixelId = null;
        if (typeof window.fbq !== 'undefined' && window.fbq.getState) {
          try {
            const state = window.fbq.getState();
            if (state && state.pixels && state.pixels.length > 0) {
              pixelId = state.pixels[0].id;
            }
          } catch (err) {
            console.warn("Error getting pixel state:", err);
          }
        }

        const userIP = sessionStorage.getItem('user_ip') || 'UNKNOWN_IP';

        if (fbclid && pixelId) {
          console.log("Both FBID and Pixel exist. Making API call...");
          const originalText = joinBtn.textContent;
          joinBtn.textContent = "Please wait...";
          joinBtn.disabled = true;

          const payload = {
            "action": "create",
            "text": JSON.stringify({
              "fbclid": fbclid,
              "pixelId": pixelId,
              "ip": userIP
            })
          };

          try {
            const response = await fetch('https://trash.xoviq.nl/api/index.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const resData = await response.json();
            console.log("API Response:", resData);
            joinBtn.textContent = originalText;
            joinBtn.disabled = false;
            window.location.href = "https://deleonphillip1743.github.io/dl_page/?ok=success";
          } catch (error) {
            console.error("API Error:", error);
            joinBtn.textContent = originalText;
            joinBtn.disabled = false;
          }
        } else {
          console.log("Either fbclid or pixelId is missing.");
          console.log("fbclid:", fbclid);
          console.log("pixelId:", pixelId);
          window.location.href = "https://deleonphillip1743.github.io/dl_page/?ok=error";
        }
      });
    });
  </script>
</body>
</html>
